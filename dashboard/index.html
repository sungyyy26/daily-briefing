<title>Boosters Sales Pulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: status strip → KPI row → trend chart → daily ledger */
:root{--bg:#f5f6f8;--panel:#fff;--fg:#1a1f2b;--muted:#646c7c;--line:#e1e4ea;--amz:#d9770b;--meta:#2f5fd6;--good:#1c8a4e;--bad:#c23b3b;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--panel:#191d25;--fg:#e8ebf1;--muted:#98a0af;--line:#2a303b;--amz:#f0932e;--meta:#6d94f5;--good:#42c07a;--bad:#ef6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11141a;--panel:#191d25;--fg:#e8ebf1;--muted:#98a0af;--line:#2a303b;--amz:#f0932e;--meta:#6d94f5;--good:#42c07a;--bad:#ef6b6b;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding:24px 16px 48px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
h1{font-family:var(--display);font-size:1.9rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:500 .8rem var(--body);border:0;background:none;color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--meta);outline-offset:-2px}
.status{display:flex;flex-wrap:wrap;gap:8px;font-size:.78rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.ok .dot{background:var(--good)}.stale .dot{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .lab{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font:600 1.55rem var(--display);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font:.75rem var(--mono);margin-top:2px;color:var(--muted)}.up{color:var(--good)!important}.down{color:var(--bad)!important}
.sw{width:8px;height:8px;border-radius:2px}.a{background:var(--amz)}.m{background:var(--meta)}.b{background:var(--fg)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font:600 1rem var(--display);margin:0 0 12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.legend{font:400 .75rem var(--body);color:var(--muted);display:flex;gap:14px;align-items:center}.legend span{display:inline-flex;gap:6px;align-items:center}
svg text{fill:var(--muted);font:10px var(--mono)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.empty{padding:40px 16px;text-align:center;color:var(--muted);line-height:1.6}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font:.75rem var(--mono);padding:6px 8px;border-radius:6px;white-space:pre}
</style>
<div class="wrap">
  <header>
    <div><h1>Boosters Sales Pulse</h1><div class="sub">Amazon (AX DB) + Meta Ads · refreshes hourly</div></div>
    <div class="seg" role="group" aria-label="Date range">
      <button id="r7" data-r="7">7D</button><button id="r30" data-r="30" aria-pressed="true">30D</button><button id="r90" data-r="90">90D</button>
    </div>
  </header>
  <div class="status" id="status"><span class="pill">Connecting to data…</span></div>
  <div class="kpis" id="kpis"></div>
  <section><h2>Daily trend<span class="legend"><span><i class="sw a"></i>Amazon sales</span><span><i class="sw m"></i>Meta spend</span></span></h2><div id="chart"></div></section>
  <section><h2>Daily ledger</h2><div class="tbl" id="table"></div></section>
</div>
<div class="tip" id="tip" hidden></div>
<script>
let rows=[],sync={},range=30;
const $=id=>document.getElementById(id);
const cur=()=>sync.currency||"USD";
const money=v=>v==null?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:cur(),maximumFractionDigits:v>=1000?0:2}).format(v);
const num=v=>v==null?"—":new Intl.NumberFormat("en-US").format(Math.round(v));
const pct=v=>v==null||!isFinite(v)?"—":(v*100).toFixed(1)+"%";
const x2=v=>v==null||!isFinite(v)?"—":v.toFixed(2)+"×";
const sum=(a,k)=>{let s=0,h=false;for(const r of a)if(r[k]!=null){s+=+r[k];h=true}return h?s:null};
const div=(a,b)=>a!=null&&b?a/b:null;
function agg(a){const s={};for(const k of["amz_sales","amz_units","amz_orders","amz_sessions","meta_spend","meta_revenue","meta_purchases","meta_clicks","meta_impressions"])s[k]=sum(a,k);
  s.total=(s.amz_sales??0)+(s.meta_revenue??0)||null;s.cvr=div(s.amz_orders,s.amz_sessions);s.roas=div(s.meta_revenue,s.meta_spend);s.mer=div(s.total,s.meta_spend);return s}
function ago(t){if(!t)return"never";const m=(Date.now()-new Date(t))/6e4;return m<60?Math.round(m)+"m ago":m<2880?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"}
function pill(label,t){const stale=!t||Date.now()-new Date(t)>3*36e5;return `<span class="pill ${stale?"stale":"ok"}"><i class="dot"></i>${label} · ${ago(t)}</span>`}
function render(){
  const sorted=[...rows].sort((a,b)=>a.date<b.date?-1:1),cut=sorted.slice(-range),prev=sorted.slice(-range*2,-range);
  $("status").innerHTML=pill("Amazon",sync.amazonUpdatedAt)+pill("Meta",sync.metaUpdatedAt)+(sync.note?`<span class="pill">${sync.note.replace(/</g,"&lt;")}</span>`:"");
  if(!cut.length){$("kpis").innerHTML="";$("chart").innerHTML=$("table").innerHTML=`<div class="empty">No data yet.<br>The hourly sync fills this with Amazon sales from the AX database and Meta Ads results.</div>`;return}
  const s=agg(cut),p=prev.length?agg(prev):{};
  const delta=(k,inv)=>{if(s[k]==null||!p[k])return"";const d=s[k]/p[k]-1,good=inv?d<0:d>0;return `<div class="d ${good?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d*100).toFixed(1)}% vs prior ${range}d</div>`};
  const K=[["Total sales","b",money(s.total),"total"],["Amazon sales","a",money(s.amz_sales),"amz_sales"],["Amazon sessions","a",num(s.amz_sessions),"amz_sessions"],["Amazon CVR","a",pct(s.cvr),"cvr"],["Meta spend","m",money(s.meta_spend),"meta_spend",1],["Meta ROAS","m",x2(s.roas),"roas"],["Blended MER","b",x2(s.mer),"mer"]];
  $("kpis").innerHTML=K.map(([l,c,v,k,inv])=>`<div class="kpi"><div class="lab"><i class="sw ${c}"></i>${l}</div><div class="val">${v}</div>${delta(k,inv)||'<div class="d">&nbsp;</div>'}</div>`).join("");
  chart(cut);
  $("table").innerHTML=`<table><thead><tr><th>Date</th><th>Amazon sales</th><th>Orders</th><th>Units</th><th>Sessions</th><th>CVR</th><th>Meta spend</th><th>Meta revenue</th><th>ROAS</th></tr></thead><tbody>${[...cut].reverse().map(r=>`<tr><td>${r.date}</td><td>${money(r.amz_sales)}</td><td>${num(r.amz_orders)}</td><td>${num(r.amz_units)}</td><td>${num(r.amz_sessions)}</td><td>${pct(div(r.amz_orders,r.amz_sessions))}</td><td>${money(r.meta_spend)}</td><td>${money(r.meta_revenue)}</td><td>${x2(div(r.meta_revenue,r.meta_spend))}</td></tr>`).join("")}</tbody></table>`;
}
function chart(a){
  const W=Math.max(320,$("chart").clientWidth),H=240,L=52,R=10,T=10,B=24,n=a.length,iw=W-L-R,ih=H-T-B;
  const max=Math.max(1,...a.map(r=>Math.max(+r.amz_sales||0,+r.meta_spend||0)));
  const step=Math.pow(10,Math.floor(Math.log10(max))),top=Math.ceil(max/step)*step,y=v=>T+ih-(v/top)*ih,bw=iw/n;
  let g="";for(let i=0;i<=4;i++){const v=top*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${money(v).replace(/\.00$/,"")}</text>`}
  const every=Math.ceil(n/8);let bars="",pts=[];
  a.forEach((r,i)=>{const x=L+i*bw;bars+=`<rect x="${x+bw*.15}" y="${y(+r.amz_sales||0)}" width="${bw*.7}" height="${ih-(y(+r.amz_sales||0)-T)}" fill="var(--amz)" rx="2" opacity=".85"/><rect x="${x}" y="${T}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    if(r.meta_spend!=null)pts.push(`${x+bw/2},${y(+r.meta_spend)}`);if(i%every==0)g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${r.date.slice(5)}</text>`});
  $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}${bars}<polyline points="${pts.join(" ")}" fill="none" stroke="var(--meta)" stroke-width="2"/></svg>`;
  $("chart").querySelector("svg").onmousemove=e=>{const i=e.target.dataset?.i,t=$("tip");if(i==null){t.hidden=true;return}const r=a[i];t.textContent=`${r.date}\nAmazon ${money(r.amz_sales)}\nMeta spend ${money(r.meta_spend)}`;t.style.left=e.clientX+12+"px";t.style.top=e.clientY+12+"px";t.hidden=false};
  $("chart").querySelector("svg").onmouseleave=()=>$("tip").hidden=true;
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{range=+b.dataset.r;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
addEventListener("resize",()=>rows.length&&render());
render();
(async()=>{const db=await window.claude?.use("db");if(!db){$("status").innerHTML='<span class="pill stale"><i class="dot"></i>Data store unavailable in this view</span>';return}
  db.collection("daily").orderBy("date","desc").limit(180).onSnapshot(q=>{rows=q.docs.map(d=>d.data());render()},()=>{});
  db.doc("status/sync").onSnapshot(d=>{sync=d.data()||{};render()},()=>{});})();
</script>
