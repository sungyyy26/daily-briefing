name: Meta sync
on:
  schedule: [{cron: "7 * * * *"}]   # hourly
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sync/fetch_meta.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: "1298298124998350"
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
